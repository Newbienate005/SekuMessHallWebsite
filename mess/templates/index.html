<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mess Hall - Home</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'style.css' %}">
  <style>
    /* Add this CSS to style the background */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-image: url("{% static 'media/background.jpg' %}"); /* Use the static tag to reference the image */
      background-size: cover; /* Ensures the image covers the entire background */
      background-position: center; /* Centers the image */
      background-repeat: no-repeat; /* Prevents the image from repeating */
      background-attachment: fixed; /* Keeps the background fixed while scrolling */
      color: white; /* Adjust text color for better visibility */
    }
  
    header {
      background-color: rgba(0, 0, 0, 0.7); /* Semi-transparent background for header */
      padding: 20px;
      text-align: center;
    }
  
    header h1 {
      margin: 0;
      font-size: 2.5em;
    }
  
    nav {
      margin-top: 10px;
    }
  
    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-size: 1.2em;
    }
  
    nav a:hover {
      text-decoration: underline;
    }
  
    main {
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent background for content */
      margin: 20px;
      border-radius: 10px;
    }
  
    .announcements, .report {
      margin-bottom: 20px;
    }
  
    .announcements h2, .report h2 {
      margin-top: 0;
    }
  
    .footer {
      text-align: center;
      padding: 10px;
      background-color: rgba(0, 0, 0, 0.7); /* Semi-transparent background for footer */
      margin-top: 20px;
    }
  
    .footer small {
      font-size: 0.9em;
    }
  
    button {
      padding: 10px 20px;
      background-color: #008148;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1em;
    }
  
    button:hover {
      background-color: #0fb300;
    }
  
    /* Style for the "View Menu" link */
    .btn {
      display: inline-block;
      padding: 10px 20px;
      background-color: #008148; /* Green background */
      color: white; /* White text */
      text-decoration: none; /* Remove underline */
      border-radius: 5px; /* Rounded corners */
      font-size: 1em;
      transition: background-color 0.3s ease; /* Smooth hover effect */
    }
  
    .btn:hover {
      background-color: #0fb300; /* Darker green on hover */
    }
  
    /* Style for the "Sign Up" link in the navigation */
    nav a.signup-link {
      background-color: #007bff; /* Blue background */
      padding: 8px 16px; /* Padding for button-like appearance */
      border-radius: 5px; /* Rounded corners */
      transition: background-color 0.3s ease; /* Smooth hover effect */
    }
  
    nav a.signup-link:hover {
      background-color: #0056b3; /* Darker blue on hover */
    }
  </style>
</head>
<body>
  <header>
    {% for message in messages %}
    <p id="messages"> {{message}} </p>
    {% endfor %}
    <h1>Welcome to the Mess Hall</h1>
    <nav>
      <a href="{% url 'index' %}">Home</a>
      <a href="{% url 'menu' %}">Menu</a>
      <a href="{% url 'signupPage' %}">Sign Up</a>
    </nav>
  </header>
  <main>
    <p>Enjoy delicious meals at affordable prices. Click below to view our menu.</p>
    <a href="{% url 'menu' %}" class="btn">View Menu</a>
    <a href="{% url 'logoutPage' %}" class="btn">Logout</a>
  </main>
  <footer>
    <p>&copy; 2025 Mess Hall. All rights reserved.</p>
  </footer>
</body>
</html>
