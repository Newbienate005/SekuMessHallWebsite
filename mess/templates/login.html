<html lang="eng">
    <head>
        <title>Login Page</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f4f4; 
                margin: 0;
                padding: 0;
                height: 100vh; 
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .container {
                width: 100%;
                max-width: 1200px;
                margin: 0 auto;
                padding: 20px;
            }

            .card {
                border: none;
                border-radius: 8px; 
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); 
                overflow: hidden;
                width: 25%; 
                margin: 0 auto;
            }

            .card-header {
                background-color: #008148; 
                color: white; 
                text-align: center;
                padding: 15px;
                font-size: 20px;
                font-weight: bold;
                border-bottom: 1px solid rgba(0, 0, 0, 0.1); 
            }

            .card-body {
                padding: 20px;
            }

            .form-group {
                margin-bottom: 15px;
            }

            .form-group label {
                display: block;
                margin-bottom: 5px;
                font-weight: bold;
                color: #333; 
            }

            .form-group input,
            .form-group select {
                width: 100%;
                padding: 10px;
                border: 1px solid #ccc; 
                border-radius: 4px; 
                font-size: 14px;
                transition: border-color 0.3s ease; 
            }

            .form-group input:focus,
            .form-group select:focus {
                border-color: #008148; 
                outline: none; 
            }

            .btn {
                width: 100%;
                padding: 10px;
                background-color: #008148; 
                color: white; 
                border: none;
                border-radius: 4px; 
                font-size: 16px;
                cursor: pointer;
                transition: background-color 0.3s ease;
            }

            .btn:hover {
                background-color: #0fb300; 
            }

            .card-footer {
                background-color: #f8f9fa; 
                padding: 10px;
                text-align: center;
                border-top: 1px solid rgba(0, 0, 0, 0.1); 
                font-size: 12px;
                color: #777;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="card">
                <div class="card-header">
                    Login Form
                </div>
                <div class="card-body">
                    <form action="" method="post">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" class="form-control" name="email" required/>
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" class="form-control" name="password" required/>
                        </div>
                        <div class="form-group">
                            <label for="role">Role</label>
                            <select id="role" name="role" required>
                                <option value="Admin">Admin</option>
                                <option value="Worker">Worker</option>
                                <option value="Student/Staff">Student/Staff</option>
                            </select>
                        </div>
                        <input type="submit" class="btn" value="Login" name="">
                    </form>
                </div>
                <div class="card-footer">
                    <small>&copy; South Eastern Kenya University </small>
                </div>
            </div>
        </div>
    </body>
</html>
